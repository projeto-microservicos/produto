name: Integrated local smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate release rendering
        run: python -m unittest discover -s tests -v
      - name: Generate local settings and validate Compose
        run: |
          python scripts/project.py init
          docker compose config --quiet
      - name: Start six services
        run: python scripts/project.py up
      - name: End-to-end functional checks
        run: python scripts/project.py smoke
      - name: Short load test
        run: python scripts/project.py load --profile smoke
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results
          path: |
            artifacts/k6-summary.json
            artifacts/compose.log
      - name: Stop disposable environment
        if: always()
        run: python scripts/project.py down
