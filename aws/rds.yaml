AWSTemplateFormatVersion: '2010-09-09'
Description: Optional private PostgreSQL for the existing store EKS VPC. Review cost before creating.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two private subnets in different availability zones
  NodeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the EKS worker nodes
  DatabaseClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]
Resources:
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from EKS nodes only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref NodeSecurityGroupId
  Subnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Store private database subnets
      SubnetIds: !Ref PrivateSubnetIds
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DatabaseClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: store
      MasterUsername: storeadmin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref Subnets
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Project
          Value: store
Outputs:
  Endpoint:
    Value: !GetAtt Database.Endpoint.Address
  MasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
