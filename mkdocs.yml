site_name: Projeto de microsserviços
site_description: Contratos, operação e documentação da equipe
repo_url: https://github.com/projeto-microservicos/produto
site_url: !ENV [SITE_URL, '']
theme:
  name: mkdocs
  locale: pt_BR
nav:
  - Início: index.md
  - Arquitetura e contratos: architecture.md
  - Mensageria (EDA): mensageria.md
  - Desenvolvimento: development.md
  - Testes de carga e HPA: load-testing.md
  - Resultados da validação: validation.md
  - Deploy e capacidade: deployment.md
  - Custos, PaaS e SLA: costs.md
markdown_extensions:
  - tables
  - fenced_code
  - admonition
strict: true
