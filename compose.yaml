name: store-project

x-java: &java
  restart: unless-stopped
  networks: [backend]
  environment: &java-env
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
  healthcheck: &java-health
    test: [CMD, curl, -fsS, http://localhost:9091/actuator/health/readiness]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

x-db: &db
  image: postgres:17
  restart: unless-stopped
  networks: [backend]
  environment:
    POSTGRES_USER: store
    POSTGRES_DB: store
    POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python scripts/project.py init}
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
    interval: 5s
    timeout: 3s
    retries: 30

x-datasource: &datasource
  DATABASE_PORT: '5432'
  DATABASE_DB: store
  DATABASE_USERNAME: store
  DATABASE_PASSWORD: ${DB_PASSWORD:?Run python scripts/project.py init}

services:
  account-db:
    <<: *db
    volumes: [account-data:/var/lib/postgresql/data]
  product-db:
    <<: *db
    volumes: [product-data:/var/lib/postgresql/data]
  order-db:
    <<: *db
    volumes: [order-data:/var/lib/postgresql/data]
  account:
    <<: *java
    build: ./services/account
    image: store/account-service:dev
    environment:
      <<: [*java-env, *datasource]
      DATABASE_HOST: account-db
    depends_on:
      account-db: {condition: service_healthy}
  product:
    <<: *java
    build: ./services/product
    image: store/product-service:dev
    environment:
      <<: [*java-env, *datasource]
      DATABASE_HOST: product-db
    depends_on:
      product-db: {condition: service_healthy}
  auth:
    <<: *java
    build: ./services/auth
    image: store/auth-service:dev
    environment:
      <<: *java-env
      ACCOUNT_URL: http://account:8080
      JWT_SECRET: ${JWT_SECRET:?Run python scripts/project.py init}
      JWT_COOKIE_SECURE: 'false'
    depends_on:
      account: {condition: service_healthy}
  exchange:
    build: ./services/exchange
    image: store/exchange-service:dev
    restart: unless-stopped
    networks: [backend]
    environment:
      CACHE_ENABLED: 'false'
      MESSAGING_ENABLED: 'false'
      EXCHANGE_PROVIDER_URL: ${EXCHANGE_PROVIDER_URL:-https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/}
      EXCHANGE_PROVIDER_TIMEOUT: ${EXCHANGE_PROVIDER_TIMEOUT:-3}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
  order:
    <<: *java
    build: ./services/order
    image: store/order-service:dev
    environment:
      <<: [*java-env, *datasource]
      DATABASE_HOST: order-db
      PRODUCT_URL: http://product:8080
      EXCHANGE_URL: http://exchange:8080
      CACHE_ENABLED: 'false'
      MESSAGING_ENABLED: 'false'
      JWT_ENABLED: 'false'
      PAYMENTS_ENABLED: 'false'
    depends_on:
      order-db: {condition: service_healthy}
      product: {condition: service_healthy}
      exchange: {condition: service_healthy}
  gateway:
    <<: *java
    build: ./services/gateway
    image: store/gateway-service:dev
    ports: ['127.0.0.1:${HTTP_PORT:-8080}:8080']
    environment:
      <<: *java-env
      AUTH_URL: http://auth:8080
      ACCOUNT_URL: http://account:8080
      ORDER_URL: http://order:8080
      PRODUCT_URL: http://product:8080
      EXCHANGE_URL: http://exchange:8080
      CORS_ALLOWED_ORIGINS: http://localhost:*
    depends_on:
      auth: {condition: service_healthy}
      order: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    networks: [backend]
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=3d]
  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    networks: [backend]
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run python scripts/project.py init}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
  k6:
    image: grafana/k6:1.6.1
    profiles: [load]
    networks: [backend]
    environment:
      BASE_URL: http://gateway:8080
      LOAD_PROFILE: ${LOAD_PROFILE:-smoke}
      MAX_VUS: ${MAX_VUS:-30}
    volumes:
      - ./load:/scripts:ro
      - ./artifacts:/results
    command: [run, /scripts/store.js]

networks:
  backend: {}
volumes:
  account-data: {}
  product-data: {}
  order-data: {}
  prometheus-data: {}
  grafana-data: {}
